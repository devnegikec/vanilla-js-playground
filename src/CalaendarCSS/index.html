<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calander</title>
    <link rel="stylesheet" href="../main.css" />
  </head>
  <body>
    <div class="calendar-container">
      <div class="header">
        <ul class="weekdays">
          <li>Sunday</li>
          <li>Monday</li>
          <li>Tuesday</li>
          <li>Wednesday</li>
          <li>Thursday</li>
          <li>Friday</li>
          <li>Saturday</li>
        </ul>
        <ul class="daynumbers">
          <li>1</li>
          <li>2</li>
          <li>3</li>
          <li>4</li>
          <li>5</li>
        </ul>
      </div>
      <div class="timeslots-container">
        <ul class="timeslots">
          <li>9<sup>am</sup></li>
          <li>10<sup>am</sup></li>
          <li>11<sup>am</sup></li>
          <li>12<sup>pm</sup></li>
          <li>1<sup>pm</sup></li>
          <li>2<sup>pm</sup></li>
          <li>3<sup>pm</sup></li>
          <li>4<sup>pm</sup></li>
          <li>5<sup>pm</sup></li>
        </ul>
      </div>
      <div class="event-containers">
        <div class="slot slot-1">
          <div class="event-status"></div>
          <span>Event A</span>
        </div>
      </div>
    </div>
  </body>
</html>
